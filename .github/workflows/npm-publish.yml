# Publishes to npm via Trusted Publishing (OIDC) when a GitHub release is created.
# Configure the Trusted Publisher on https://www.npmjs.com/package/@dasmeta/event-manager-cli/access
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  id-token: write # Required for OIDC Trusted Publishing
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # Never cache in release builds — can break OIDC auth setup
          package-manager-cache: false
      - run: yarn install --frozen-lockfile
      # Trusted Publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm publish --access public
        # Do NOT set NODE_AUTH_TOKEN — it overrides OIDC and causes 404
